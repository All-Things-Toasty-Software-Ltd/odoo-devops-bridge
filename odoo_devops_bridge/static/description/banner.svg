  -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFDF9"/>
            <stop offset="100%" stop-color="#FAF0E4"/>
        </linearGradient>
        <pattern id="dotPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
            <circle cx="3" cy="3" r="2" fill="#E2D1C3" opacity="0.6"/>
        </pattern>
        <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#7C2D12"
                          flood-opacity="0.06"/>
        </filter>
    </defs>

    <rect width="1200" height="600" fill="url(#bg)"/>
    <rect width="1200" height="600" fill="url(#dotPattern)"/>

    <!-- Title & Subtitle -->
    <text x="80" y="150" font-family="'Inter', system-ui, sans-serif" font-weight="800"
          font-size="54" fill="#292524" letter-spacing="-1">DevOps Project Bridge
    </text>
    <text x="80" y="200" font-family="'Inter', system-ui, sans-serif" font-weight="500"
          font-size="22" fill="#78716C">GitHub · GitLab · YouTrack, synced into Odoo Projects
    </text>

    <!-- Badges -->
    <g transform="translate(80, 240)">
        <!-- GitHub Badge -->
        <rect x="0" y="0" width="110" height="40" rx="20" fill="#FEF3C7" stroke="#F59E0B"
              stroke-width="2"/>
        <circle cx="20" cy="20" r="6" fill="#D97706"/>
        <text x="36" y="25" font-family="sans-serif" font-weight="700" font-size="15"
              fill="#92400E">GitHub
        </text>

        <!-- GitLab Badge -->
        <rect x="125" y="0" width="110" height="40" rx="20" fill="#EDE9FE" stroke="#8B5CF6"
              stroke-width="2"/>
        <circle cx="145" cy="20" r="6" fill="#7C3AED"/>
        <text x="161" y="25" font-family="sans-serif" font-weight="700" font-size="15"
              fill="#5B21B6">GitLab
        </text>

        <!-- YouTrack Badge -->
        <rect x="250" y="0" width="120" height="40" rx="20" fill="#CCFBF1" stroke="#0D9488"
              stroke-width="2"/>
        <circle cx="270" cy="20" r="6" fill="#0D9488"/>
        <text x="286" y="25" font-family="sans-serif" font-weight="700" font-size="15"
              fill="#115E59">YouTrack
        </text>
    </g>

    <!-- Key Bullet Points -->
    <g transform="translate(80, 330)" font-family="'Inter', system-ui, sans-serif" font-size="18"
       fill="#44403C" font-weight="500">
        <g transform="translate(0,0)">
            <circle cx="10" cy="-6" r="6" fill="#0D9488"/>
            <text x="30" y="0">Two-way task &amp; issue sync with loop protection</text>
        </g>
        <g transform="translate(0,40)">
            <circle cx="10" cy="-6" r="6" fill="#0D9488"/>
            <text x="30" y="0">Personal tokens per user, bot fallback for automation</text>
        </g>
        <g transform="translate(0,80)">
            <circle cx="10" cy="-6" r="6" fill="#0D9488"/>
            <text x="30" y="0">Pull / merge request tracking with review status</text>
        </g>
        <g transform="translate(0,120)">
            <circle cx="10" cy="-6" r="6" fill="#0D9488"/>
            <text x="30" y="0">Instant webhooks, plus fallback polling</text>
        </g>
    </g>

    <!-- Hub Illustration on the Right -->
    <g transform="translate(850, 300)" filter="url(#softShadow)">
        <!-- Connections -->
        <line x1="0" y1="0" x2="0" y2="-130" stroke="#F59E0B" stroke-width="8"
              stroke-dasharray="8 6"/>
        <line x1="0" y1="0" x2="-120" y2="90" stroke="#0D9488" stroke-width="8"
              stroke-dasharray="8 6"/>
        <line x1="0" y1="0" x2="120" y2="90" stroke="#8B5CF6" stroke-width="8"
              stroke-dasharray="8 6"/>

        <!-- Nodes -->
        <circle cx="0" cy="-130" r="32" fill="#FFF8F0" stroke="#F59E0B" stroke-width="8"/>
        <circle cx="0" cy="-130" r="10" fill="#F59E0B"/>

        <circle cx="-120" cy="90" r="32" fill="#F0FDFA" stroke="#0D9488" stroke-width="8"/>
        <circle cx="-120" cy="90" r="10" fill="#0D9488"/>

        <circle cx="120" cy="90" r="32" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="8"/>
        <circle cx="120" cy="90" r="10" fill="#8B5CF6"/>

        <!-- Center Odoo Hub -->
        <circle cx="0" cy="0" r="46" fill="#FFFFFF" stroke="#EA580C" stroke-width="10"/>
        <circle cx="0" cy="0" r="18" fill="#EA580C"/>
    </g>
</svg>
